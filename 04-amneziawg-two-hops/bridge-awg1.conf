# МОСТ (Россия): точка AmneziaWG для телефонов, awg1.
# /etc/amnezia/amneziawg/awg1.conf  →  awg-quick up awg1  (поднимать ПОСЛЕ awg0)
# Свой набор параметров обфускации, не обязательно как у awg0. Должен совпадать с phone.conf.
# MTU меньше, чем у awg0: пакет телефона потом едет внутри туннеля awg0.

[Interface]
Address = 10.8.1.1/24
ListenPort = <BRIDGE_AWG_PORT>
PrivateKey = <BRIDGE_AWG1_PRIVATE_KEY>
MTU = 1380
Jc = <JC_PHONE>
Jmin = <JMIN_PHONE>
Jmax = <JMAX_PHONE>
S1 = <S1_PHONE>
S2 = <S2_PHONE>
H1 = <H1_PHONE>
H2 = <H2_PHONE>
H3 = <H3_PHONE>
H4 = <H4_PHONE>
PostUp = sysctl -w net.ipv4.ip_forward=1; iptables -A FORWARD -i awg1 -o awg0 -j ACCEPT; iptables -A FORWARD -i awg0 -o awg1 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT; iptables -t nat -A POSTROUTING -s 10.8.1.0/24 -o awg0 -j MASQUERADE
PostDown = iptables -D FORWARD -i awg1 -o awg0 -j ACCEPT; iptables -D FORWARD -i awg0 -o awg1 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT; iptables -t nat -D POSTROUTING -s 10.8.1.0/24 -o awg0 -j MASQUERADE

[Peer]
# телефон 1
PublicKey = <PHONE_AWG_PUBLIC_KEY>
AllowedIPs = 10.8.1.2/32
