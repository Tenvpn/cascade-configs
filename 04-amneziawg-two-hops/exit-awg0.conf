# ВЫХОД (за границей): сервер межсерверного туннеля awg0.
# /etc/amnezia/amneziawg/awg0.conf  →  awg-quick up awg0
# Параметры обфускации (Jc…H4) должны совпадать с bridge-awg0.conf.

[Interface]
Address = 10.66.0.1/30
ListenPort = <EXIT_AWG_PORT>
PrivateKey = <EXIT_AWG_PRIVATE_KEY>
MTU = 1420
Jc = <JC>
Jmin = <JMIN>
Jmax = <JMAX>
S1 = <S1>
S2 = <S2>
H1 = <H1>
H2 = <H2>
H3 = <H3>
H4 = <H4>
# <EXIT_WAN> — внешний интерфейс выхода: ip route show default (слово после dev, например eth0).
# FORWARD-правила нужны, если там политика DROP (ufw, firewalld).
PostUp = sysctl -w net.ipv4.ip_forward=1; iptables -I FORWARD -i awg0 -o <EXIT_WAN> -j ACCEPT; iptables -I FORWARD -i <EXIT_WAN> -o awg0 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT; iptables -t nat -A POSTROUTING -s 10.66.0.0/30 -o <EXIT_WAN> -j MASQUERADE
PostDown = iptables -D FORWARD -i awg0 -o <EXIT_WAN> -j ACCEPT; iptables -D FORWARD -i <EXIT_WAN> -o awg0 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT; iptables -t nat -D POSTROUTING -s 10.66.0.0/30 -o <EXIT_WAN> -j MASQUERADE

[Peer]
# мост
PublicKey = <BRIDGE_AWG0_PUBLIC_KEY>
AllowedIPs = 10.66.0.2/32
