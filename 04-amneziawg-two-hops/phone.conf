# ТЕЛЕФОН: импорт в приложение AmneziaVPN / AmneziaWG.
# Параметры обфускации — те же, что в bridge-awg1.conf.

[Interface]
Address = 10.8.1.2/32
PrivateKey = <PHONE_AWG_PRIVATE_KEY>
DNS = 1.1.1.1
MTU = 1380
Jc = <JC_PHONE>
Jmin = <JMIN_PHONE>
Jmax = <JMAX_PHONE>
S1 = <S1_PHONE>
S2 = <S2_PHONE>
H1 = <H1_PHONE>
H2 = <H2_PHONE>
H3 = <H3_PHONE>
H4 = <H4_PHONE>

[Peer]
# мост
PublicKey = <BRIDGE_AWG1_PUBLIC_KEY>
Endpoint = <BRIDGE_IP>:<BRIDGE_AWG_PORT>
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
