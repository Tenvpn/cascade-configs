# МОСТ (Россия): клиент межсерверного туннеля awg0 к выходу.
# /etc/amnezia/amneziawg/awg0.conf  →  awg-quick up awg0
# Table = off: туннель НЕ забирает весь трафик моста (иначе SSH и сам мост уйдут за границу).
# MTU 1420 явно и одинаково на обоих концах awg0, у awg1 и телефона — 1380 (влезает внутрь awg0).
# В туннель уходит только то, что пришло от телефонов через awg1 (правило iif awg1 → таблица 100).

[Interface]
Address = 10.66.0.2/30
PrivateKey = <BRIDGE_AWG0_PRIVATE_KEY>
Table = off
MTU = 1420
Jc = <JC>
Jmin = <JMIN>
Jmax = <JMAX>
S1 = <S1>
S2 = <S2>
H1 = <H1>
H2 = <H2>
H3 = <H3>
H4 = <H4>
# rp_filter = 2: ответы из интернета приходят в awg0 с чужих адресов, строгая проверка их бы выкинула.
PostUp = sysctl -w net.ipv4.conf.awg0.rp_filter=2; ip route replace default dev awg0 table 100; ip rule add iif awg1 table 100 priority 100
PostDown = ip rule del iif awg1 table 100 priority 100; ip route flush table 100

[Peer]
# выход
PublicKey = <EXIT_AWG_PUBLIC_KEY>
Endpoint = <EXIT_IP>:<EXIT_AWG_PORT>
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
